name: Build, Analyse & Release

on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-analyze:
    name: Compilation
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Initialisation des submodules
        run: |
          git -c "url.https://github.com/.insteadOf=https://x-access-token:${{ github.token }}@github.com/" \
              submodule update --init --recursive

      - name: Configuration .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Préparation de l'environnement Dalamud
        run: |
          DALAMUD_PATH="$HOME/.xlcore/dalamud/Hooks/dev"
          mkdir -p "$DALAMUD_PATH"
          curl -L https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -o latest.zip
          unzip -o latest.zip -d "$DALAMUD_PATH"
          rm -f latest.zip
          echo "DALAMUD_DIR=$DALAMUD_PATH" >> $GITHUB_ENV

      - name: Nettoyage du cache NuGet
        run: dotnet nuget locals all --clear

      - name: Restauration des dépendances
        run: dotnet restore UmbraSync.sln --locked-mode


      - name: Compilation
        run: |
          dotnet build UmbraSync.sln --no-restore --configuration Release --nologo -p:ContinuousIntegrationBuild=true

      - name: Création de l'archive
        run: |
          # Création du dossier temporaire pour l'archive Dalamud
          mkdir -p publish/UmbraSync
          cp -r UmbraSync/bin/x64/Release/* publish/UmbraSync/
          cd publish
          zip -r ../UmbraSync.zip .
          cd ..

      - name: Envoi de l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: UmbraSync
          path: UmbraSync.zip
          if-no-files-found: error

